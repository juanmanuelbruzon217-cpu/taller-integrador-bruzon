<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de promedio</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="contenedor">
        <h1>Calculadora de Promedio</h1>
        <p>Ingrese las tres notas del corte para calcular el promedio.</p>

        <label>Nota 1:</label>
        <input type="number" id="nota1" step="0.1">

        <label>Nota 2:</label>
        <input type="number" id="nota2" step="0.1">

        <label>Nota 3:</label>
        <input type="number" id="nota3" step="0.1">

        <button onclick="calcularPromedio()">Calcular</button>

        <p id="resultadoPromedio"></p>
        <p id="resultadoEstado"></p>
    </div>

    <script>
        const cantidadNotas = 3;

        function calcularPromedio() {
            const nota1 = parseFloat(document.getElementById("nota1").value);
            const nota2 = parseFloat(document.getElementById("nota2").value);
            const nota3 = parseFloat(document.getElementById("nota3").value);

            if (isNaN(nota1) || isNaN(nota2) || isNaN(nota3)) {
                document.getElementById("resultadoPromedio").innerHTML = "Debe ingresar las tres notas.";
                return;
            }

            const promedio = (nota1 + nota2 + nota3) / cantidadNotas;

            document.getElementById("resultadoPromedio").innerHTML = "Promedio: " + promedio.toFixed(2);

            if (promedio >= 3.0) {
                document.getElementById("resultadoEstado").innerHTML = "Resultado: aprobado";
            } else {
                document.getElementById("resultadoEstado").innerHTML = "Resultado: reprobado";
            }
        }
    </script>

</body>
</html>

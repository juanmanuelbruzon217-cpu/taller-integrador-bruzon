<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>pagina</title>
    <link rel="stylesheet" href="Estilos Del Sitio.CSS">
</head>
<body>

    <div class="cont1">
        <h1>Calculadora de Promedio</h1>
        <p>Ingrese las tres notas del corte para calcular el promedio.</p>

        <label>Nota 1:</label>
        <input type="number" id="n1" step="0.1">

        <label>Nota 2:</label>
        <input type="number" id="n2" step="0.1">

        <label>Nota 3:</label>
        <input type="number" id="n3" step="0.1">

        <button onclick="calc()">Calcular</button>

        <p id="r"></p>
        <p id="r2"></p>
    </div>

<script>

let data1 = [];
let TempValue2 = 0;
let x = 3;

function calc() {

    let a = parseFloat(document.getElementById("n1").value);
    let b = parseFloat(document.getElementById("n2").value);
    let c = parseFloat(document.getElementById("n3").value);

    console.log("valores capturados:", a, b, c);

    if (isNaN(a) || isNaN(b) || isNaN(c)) {
        document.getElementById("r").innerHTML = "Debe ingresar las tres notas.";
        return;
    }

    TempValue2 = (a + b + c) / x;

    document.getElementById("r").innerHTML = "Promedio: " + TempValue2.toFixed(2);

    if (TempValue2 >= 3.0) {
        document.getElementById("r2").innerHTML = "Resultado: aprobado";
    } else {
        document.getElementById("r2").innerHTML = "Resultado: reprobado";
    }

    console.log("promedio calculado");
}

console.log("pagina cargada");

</script>

</body>
</html>
